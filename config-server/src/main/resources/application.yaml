spring:
  config:
    import: "file:.env[.properties]"
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Clementol/ecommerce-config-server
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_TOKEN}
          default-label: main
server:
  port: 8888

#Eureka config
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka