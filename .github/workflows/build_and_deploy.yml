name: SpringBoot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:


env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: ecommerce-cluster
  GKE_ZONE: europe-west1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - config-server
          - inventory-service
          - order-service

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Login in to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password:  ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          ./mvn clean package -DskipTests

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auth to 【entity-GCP¦canonical_name=GCP】 + Get kubectl
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GK_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/
#          kubectl rollout status deployment/api-gateway
#          kubectl rollout status deployment/config-server
#          kubectl rollout status deployment/inventory-service
#          kubectl rollout status deployment/order-service
#          kubectl rollout status deployment/zipkin
